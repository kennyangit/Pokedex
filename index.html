<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedéx</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="images/pokemon_icon.png" type="image/x-icon">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-red-500 text-white py-6 shadow-lg dark:bg-gray-900 dark:text-gray-100 transition">
        <h1 class="text-3xl font-bold text-center tracking-widest">POKÉDEX</h1>

        <div class="flex flex-col sm:flex-row gap-3 justify-center mt-4">

            <!-- Filtro -->
            <select id="filter"
                class="px-4 py-2 rounded-lg text-black font-semibold bg-white dark:bg-gray-700 dark:text-white shadow-md transition">
                <option value="all">Todos</option>
                <option value="fire">Fogo</option>
                <option value="water">Água</option>
                <option value="grass">Planta</option>
                <option value="electric">Elétrico</option>
                <option value="psychic">Psíquico</option>
                <option value="legendary">Lendários</option>
            </select>

            <!-- Pesquisa -->
            <input id="search" type="text" placeholder="Pesquisar Pokémon..."
                class="px-4 py-2 rounded-lg bg-white dark:bg-gray-700 dark:text-white shadow-md font-semibold transition">

            <!-- Botão Dark Mode -->
            <button id="darkToggle"
                class="px-4 py-2 bg-black text-white rounded-lg dark:bg-yellow-400 dark:text-black font-bold shadow-md transition">
                🌙
            </button>

        </div>
    </header>


    <div id="pokemon-list" class="grid gap-6 p-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div>

    <!-- Modal -->
    <div id="modal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 dark:bg-black/70 flex items-center justify-center p-4 transition">
        <div
            class="bg-white dark:bg-gray-900 dark:text-white rounded-2xl w-full max-w-md p-6 relative shadow-xl transition">

            <!-- Botão fechar -->
            <button id="closeModal"
                class="absolute right-3 top-3 text-gray-500 dark:text-gray-300 hover:text-black dark:hover:text-white text-xl font-bold transition">
                ×
            </button>

            <!-- Conteúdo -->
            <img id="modalImage" class="w-40 h-40 mx-auto drop-shadow-xl">

            <h2 id="modalName" class="text-2xl font-bold text-center mt-4 capitalize"></h2>

            <div id="modalTypes" class="flex justify-center gap-2 mt-2"></div>

            <div class="mt-4 text-gray-700 dark:text-gray-300 space-y-1 transition">
                <p><strong>Altura:</strong> <span id="modalHeight"></span> m</p>
                <p><strong>Peso:</strong> <span id="modalWeight"></span> kg</p>
                <p><strong>Habilidades:</strong> <span id="modalAbilities"></span></p>
            </div>

            <h3 class="mt-4 font-semibold dark:text-gray-200">Stats</h3>
            <ul id="modalStats" class="mt-2 space-y-1 dark:text-gray-300"></ul>
        </div>
    </div>

    <footer class="bg-red-500 text-white py-6 shadow-lg dark:bg-gray-900 dark:text-gray-100 transition mt-10">
        <h2 class="text-center text-lg font-semibold">© 2025 Yan Kenny - Todos os direitos reservados </h2>
    </footer>


    <script src="script.js"></script>
</body>

</html>
